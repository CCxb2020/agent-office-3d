<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>智能体办公室 · Agent Office</title>
    <link rel="icon" href="/brand/logo.svg" />
    <link rel="stylesheet" href="/styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img class="logo-img" src="/brand/logo.svg" alt="Agent Office" />
        <div><b>智能体办公室</b><small>Agent Office · Multica</small></div>
      </div>
      <div id="stats" class="chips"></div>
      <div class="spacer"></div>
      <nav class="segmented" id="views" aria-label="视图">
        <button type="button" data-view="3d" aria-pressed="true">🧊 3D</button>
        <button type="button" data-view="2d" aria-pressed="false">☰ 列表</button>
        <button type="button" data-view="agenda" aria-pressed="false">📅 日程</button>
        <button type="button" data-view="history" aria-pressed="false" title="近期运行、定时运行和任务活动">📜 历史</button>
      </nav>
      <label class="pick" title="按运行时筛选办公楼">
        🏢 <select id="campus" aria-label="办公楼"><option value="sede">总部 · 全部</option></select>
      </label>
      <nav class="segmented" id="scene-mode" aria-label="3D 场景">
        <button type="button" data-mode="facade" aria-pressed="true">🏙️ 海滨</button>
        <button type="button" data-mode="interior" aria-pressed="false">🏢 办公室</button>
      </nav>
      <button id="meet-btn" type="button" title="邀请多个智能体处理同一任务">🤝 <span class="lbl">会议</span> <span id="meet-count" class="count-badge" hidden></span></button>
      <button id="palette-btn" type="button" title="快速搜索 (Ctrl+K)">🔎 <kbd>Ctrl K</kbd></button>
      <button id="feed-btn" type="button" title="实时动态">📰 <span id="feed-count" class="count-badge" hidden></span></button>
      <details class="settings">
        <summary title="场景设置">⚙️</summary>
        <div class="settings-pop">
          <div class="set-row"><span>场景时间</span><label class="clock" title="里约当地时间，控制场景光照">
        <span id="clock-icon">☀️</span>
        <span id="clock-time">--:--</span>
        <select id="clock-mode" aria-label="场景时间">
          <option value="live">实时</option>
          <option value="6.4">日出</option>
          <option value="12">正午</option>
          <option value="17.9">日落</option>
          <option value="21">夜晚</option>
        </select>
      </label></div>
          <div class="set-row"><span>场景</span><select id="theme" aria-label="场景主题"><option value="premium">🌴 屋顶全景</option><option value="classico">🏙️ 经典海滨</option><option value="minimal">⚪ 简洁模式</option></select></div>
          <div class="set-row"><span>角色</span><select id="avatar-style" aria-label="角色"><option value="pessoa">🧑 人物</option><option value="robo">🤖 机器人</option></select></div>
          <div class="set-row"><span>画质</span><select id="quality" aria-label="画质"><option value="alta">✨ 高</option><option value="leve">⚡ 流畅</option></select></div>
        </div>
      </details>
      <button id="auth" type="button" hidden>🔐 登录</button>
    </header>
    <main>
      <aside>
        <div class="side-tabs" role="tablist">
          <button type="button" role="tab" data-side="agents" aria-selected="true">智能体 <span id="count-agents"></span></button>
          <button type="button" role="tab" data-side="schedules" aria-selected="false">定时任务 <span id="count-schedules"></span></button>
        </div>
        <input id="search" type="search" placeholder="搜索智能体或任务…" />
        <div id="filters" role="group" aria-label="筛选"></div>
        <ul id="agent-list"></ul>
        <ul id="schedule-list" hidden></ul>
        <footer class="side-foot"><span id="updated">加载中…</span></footer>
      </aside>
      <section id="stage">
        <div id="scene"></div>
        <div id="grid2d" hidden></div>
        <div id="agenda" hidden></div>
        <div id="history" hidden></div>
        <aside id="issue-detail" class="issue-detail" hidden></aside>
        <div id="detail" class="drawer" hidden></div>
        <div id="sched-detail" class="drawer" hidden></div>
        <div id="working-now" class="working-now" hidden></div>
        <div id="legend" class="legend">
          <span><i class="dot working"></i>工作中 · 工位</span>
          <span><i class="dot idle"></i>空闲 · 休息区</span>
          <span><i class="dot blocked"></i>受阻 · 等待区</span>
          <span><i class="dot offline"></i>离线 · 离线区</span>
        </div>
        <div id="feed" class="feed" hidden></div>
        <div id="error" hidden></div>
      </section>
    </main>
    <footer class="credits">3D 模型: Kenney (CC0) · RobotExpressive 由 Quaternius 制作 (CC0)</footer>
    <script type="module" src="/app.js"></script>
  </body>
</html>
